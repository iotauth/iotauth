# This workflow runs the multi-Auth integration tests through
# examples/scripts/run_multi_auth_test.sh. Each test starts Auth101 and Auth102
# and connects a client registered with Auth101 (net1.client) to a server
# registered with Auth102 (net2.server), so Auth102 has to fetch the session
# key from Auth101 over the trusted-Auth channel. The Node, C, C++, and Python
# client-server pairs are tested in turn.
#
# The first test does the full Auth build and credential setup. If it
# succeeds, the later tests reuse those artifacts (--no-build --no-setup);
# otherwise each later test runs its own build and setup so it is independent.
# All four tests always run; the job fails if any of them fails.

name: Multi-Auth Integration Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  multi-auth-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: maven

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install C and C++ build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make gcc g++ libssl-dev

      - name: Make scripts executable
        run: chmod +x examples/scripts/*.sh examples/generateAll.sh examples/cleanAll.sh

      - name: Run Node client to Node server through two Auths (build + setup)
        id: node
        continue-on-error: true
        working-directory: ./examples/scripts
        run: ./run_multi_auth_test.sh --entity node

      - name: Run C client to C server through two Auths
        id: c
        if: always()
        continue-on-error: true
        working-directory: ./examples/scripts
        run: |
          if [ "${{ steps.node.outcome }}" = "success" ]; then
            ./run_multi_auth_test.sh --entity c --no-build --no-setup --stop-existing
          else
            ./run_multi_auth_test.sh --entity c --stop-existing
          fi

      - name: Run C++ client to C++ server through two Auths
        id: cpp
        if: always()
        continue-on-error: true
        working-directory: ./examples/scripts
        run: |
          if [ "${{ steps.node.outcome }}" = "success" ]; then
            ./run_multi_auth_test.sh --entity cpp --no-build --no-setup --stop-existing
          else
            ./run_multi_auth_test.sh --entity cpp --stop-existing
          fi

      - name: Run Python client to Python server through two Auths
        id: python
        if: always()
        continue-on-error: true
        working-directory: ./examples/scripts
        run: |
          if [ "${{ steps.node.outcome }}" = "success" ]; then
            ./run_multi_auth_test.sh --entity python --no-build --no-setup --stop-existing
          else
            ./run_multi_auth_test.sh --entity python --stop-existing
          fi

      - name: Fail if any test failed
        if: always()
        run: |
          result=0
          for outcome in \
            "node: ${{ steps.node.outcome }}" \
            "c: ${{ steps.c.outcome }}" \
            "cpp: ${{ steps.cpp.outcome }}" \
            "python: ${{ steps.python.outcome }}"; do
            case "$outcome" in
              *": success") ;;
              *)
                echo "A test step did not succeed ($outcome)."
                result=1
                ;;
            esac
          done
          exit $result
